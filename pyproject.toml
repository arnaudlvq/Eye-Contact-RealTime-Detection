[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-contact-realtime-detection"
version = "0.1.0"
description = "Real-time eye-contact detection from a webcam — geometric gaze on MediaPipe FaceLandmarker, no training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "mediapipe>=0.10.9",
  "opencv-python>=4.9",
  "numpy>=1.26,<2",
]

[project.urls]
Homepage = "https://github.com/arnaudlvq/Eye-Contact-RealTime-Detection"

[tool.setuptools]
packages = ["eye_contact_detector"]

[tool.setuptools.package-data]
eye_contact_detector = ["*.task"]
